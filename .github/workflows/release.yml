name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libv4l-dev libasound2-dev libfontconfig1-dev libxkbcommon-dev libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev

      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        run: |
          powershell -ExecutionPolicy Bypass -File ./scripts/package-windows.ps1 -Version "${{ github.ref_name }}" -OutDir "dist"

      - name: Package Linux Artifact
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh "${{ github.ref_name }}" dist

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

