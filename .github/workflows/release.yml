name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nexo-windows-x86_64.zip
            binary: target/release/nexo.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nexo-linux-x86_64.tar.gz
            binary: target/release/nexo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libxkbcommon-dev
      - name: Build Release Binary
        run: cargo build --release -p nexo-app
      - name: Package Windows Artifact
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          Compress-Archive -Path target/release/nexo.exe, README.md -DestinationPath dist/${{ matrix.artifact }}
      - name: Package Linux Artifact
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf dist/${{ matrix.artifact }} -C target/release nexo README.md
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh "${{ github.ref_name }}" dist
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
