[package]
name = "nexo-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "nexo"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
if-addrs.workspace = true
libp2p.workspace = true
nexo-core = { path = "../nexo-core" }
nexo-media = { path = "../nexo-media" }
nexo-net = { path = "../nexo-net" }
nexo-store = { path = "../nexo-store" }
nexo-video = { path = "../nexo-video" }
slint.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
async-compat = "0.2"
i-slint-backend-testing = "=1.17.1"

[lints.rust]
# Slint's generated component glue contains narrowly-scoped unsafe internals.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
# Slint's generated component code uses unwrap internally.
unwrap_used = "allow"
